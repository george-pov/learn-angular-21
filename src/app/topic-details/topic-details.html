<main class="details-page">
  <a routerLink="/">Back to dashboard</a>

  @if (topic(); as topic) {
    <h1>{{ topic.title }}</h1>
    <p>{{ topic.description }}</p>
    <p>Topic id: {{ topic.id }}</p>
    <p>What you will learn next: {{ nextTopic()?.title }}</p>
  } @else {
    <h1>Topic not found</h1>
    <p>No topic exists for id {{ id() }}.</p>
  }
</main>
