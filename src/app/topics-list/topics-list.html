<ul>
  @for (topic of topics(); track topic.id) {
    <li>
      <label>
        <input
          type="checkbox"
          [checked]="topic.done"
          (change)="onToggle(topic.id)"
        />
        <a [routerLink]="['/topics', topic.id]">{{ topic.title }}</a>
      </label>
      <p>{{ topic.description }}</p>
    </li>
  }
</ul>
