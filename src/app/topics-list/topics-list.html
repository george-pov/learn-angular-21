<ul class="topic-list">
  @for (topic of topics(); track topic.id) {
    <li class="topic-item">
      <label>
        <input type="checkbox" [checked]="topic.done" (change)="toggleTopic(topic.id)" />

        <span>
          <a [routerLink]="['/topics', topic.id]">
            <strong>{{ topic.title }}</strong>
          </a>
          
          <small>{{ topic.description }}</small>
        </span>
      </label>
    </li>
  }
</ul>
